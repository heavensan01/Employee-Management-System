spring.application.name=employee-management-system

# H2 file database - no MySQL installation is required
spring.datasource.url=jdbc:h2:file:./data/employee_management;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# H2 browser console - OFF by default so a public deployment is safe.
# For local debugging run:  mvn spring-boot:run -Dspring-boot.run.arguments=--spring.h2.console.enabled=true
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=true

# Server - hosts like Render/Railway provide the PORT variable
server.port=${PORT:8080}
