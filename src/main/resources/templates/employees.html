<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Employees</title><link rel="stylesheet" href="/css/style.css"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container"><div class="page-header d-flex justify-content-between align-items-center"><div><h2>Employees</h2><p>Manage employee records, departments and designations.</p></div><a href="/employees/new" class="btn btn-primary">+ Add Employee</a></div><div class="card table-card"><div class="table-responsive"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Salary</th><th>Department</th><th>Designation</th><th>Actions</th></tr></thead><tbody><tr th:each="e:${employees}"><td th:text="${e.name}"></td><td th:text="${e.email}"></td><td th:text="${e.phone}"></td><td th:text="${e.salary}"></td><td th:text="${e.department != null ? e.department.name : '-'}"></td><td th:text="${e.designation != null ? e.designation.name : '-'}"></td><td><a th:href="@{'/employees/edit/'+${e.id}}" class="btn btn-sm btn-outline-primary">Edit</a> <a th:href="@{'/employees/delete/'+${e.id}}" class="btn btn-sm btn-outline-danger">Delete</a></td></tr></tbody></table></div></div></main></body></html>
