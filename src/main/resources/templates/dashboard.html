<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | Employee Management System</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container">
    <div class="page-header">
        <h1>Dashboard</h1>
        <p>Quick overview of your employee management system.</p>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-lg-3">
            <div class="card stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-label">Employees</div>
                <div class="stat" th:text="${employeeCount}">0</div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card stat-card">
                <div class="stat-icon">🏢</div>
                <div class="stat-label">Departments</div>
                <div class="stat" th:text="${departmentCount}">0</div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card stat-card">
                <div class="stat-icon">📅</div>
                <div class="stat-label">Attendance Records</div>
                <div class="stat" th:text="${attendanceCount}">0</div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="card stat-card">
                <div class="stat-icon">💰</div>
                <div class="stat-label">Payroll Records</div>
                <div class="stat" th:text="${payrollCount}">0</div>
            </div>
        </div>
    </div>

    <div class="card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h5 class="section-title">System Overview</h5>
                <small class="text-muted">Current records in the system</small>
            </div>
        </div>
        <canvas id="chart" height="100"></canvas>
    </div>
</main>

<script th:inline="javascript">
    const employeeCount = /*[[${employeeCount}]]*/ 0;
    const departmentCount = /*[[${departmentCount}]]*/ 0;
    const attendanceCount = /*[[${attendanceCount}]]*/ 0;
    const payrollCount = /*[[${payrollCount}]]*/ 0;

    new Chart(document.getElementById('chart'), {
        type: 'bar',
        data: {
            labels: ['Employees', 'Departments', 'Attendance', 'Payroll'],
            datasets: [{
                label: 'Records',
                data: [employeeCount, departmentCount, attendanceCount, payrollCount],
                borderRadius: 8,
                borderSkipped: false
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
        }
    });
</script>
</body>
</html>
