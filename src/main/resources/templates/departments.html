<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Departments</title><link rel="stylesheet" href="/css/style.css"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container"><div class="page-header"><h2>Departments</h2><p>Organize employees by department.</p></div><div class="card p-4"><form method="post" action="/departments/save" class="d-flex gap-2 mb-3"><input class="form-control" name="name" placeholder="Department name" required><button class="btn btn-primary">Add</button></form><table class="table"><tr th:each="d:${departments}"><td th:text="${d.name}"></td><td><a class="btn btn-sm btn-danger" th:href="@{'/departments/delete/'+${d.id}}">Delete</a></td></tr></table></div></main></body></html>
