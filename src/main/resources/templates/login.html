<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Employee Management System</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="card login-card">
    <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="background:#4f46e5;color:#fff;border:0">EM</div>
        <h2 class="mb-1">Welcome back</h2>
        <p class="text-muted mb-0">Sign in to manage your employees</p>
    </div>
    <form method="post" action="/login">
        <label>Email</label>
        <input class="form-control mb-3" name="username" placeholder="Enter your email" required>
        <label>Password</label>
        <input class="form-control mb-3" name="password" type="password" placeholder="Enter your password" required>
        <button class="btn btn-primary w-100">Login</button>
    </form>
</div>
</body>
</html>
