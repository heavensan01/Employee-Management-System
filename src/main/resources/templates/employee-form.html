<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Employee</title><link rel="stylesheet" href="/css/style.css"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container"><div class="page-header"><h2>Employee</h2><p>Add or update employee information.</p></div><div class="card p-4"><form method="post" action="/employees/save" th:object="${employee}"><input type="hidden" th:field="*{id}"><div class="row"><div class="col-md-6 mb-3"><label>Name</label><input class="form-control" th:field="*{name}" required></div><div class="col-md-6 mb-3"><label>Email</label><input class="form-control" th:field="*{email}" required></div><div class="col-md-6 mb-3"><label>Phone</label><input class="form-control" th:field="*{phone}"></div><div class="col-md-6 mb-3"><label>Salary</label><input class="form-control" type="number" step="0.01" th:field="*{salary}"></div><div class="col-md-6 mb-3"><label>Department</label><select class="form-select" th:field="*{department}"><option value="">-- Select --</option><option th:each="d:${departments}" th:value="${d.id}" th:text="${d.name}"></option></select></div><div class="col-md-6 mb-3"><label>Designation</label><select class="form-select" th:field="*{designation}"><option value="">-- Select --</option><option th:each="d:${designations}" th:value="${d.id}" th:text="${d.name}"></option></select></div></div><button class="btn btn-primary">Save</button> <a href="/employees" class="btn btn-secondary">Cancel</a></form></div></main></body></html>
