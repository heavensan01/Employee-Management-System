<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Attendance</title><link rel="stylesheet" href="/css/style.css"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container"><div class="page-header"><h2>Attendance</h2><p>Record and review employee attendance.</p></div><div class="card p-4"><form method="post" action="/attendance/save" class="row g-2 mb-4"><div class="col-md-4"><select class="form-select" name="employee.id" required><option value="">Employee</option><option th:each="e:${employees}" th:value="${e.id}" th:text="${e.name}"></option></select></div><div class="col-md-3"><input class="form-control" type="date" name="date" th:value="${today}" required></div><div class="col-md-2 form-check pt-2"><input class="form-check-input" type="checkbox" name="present" checked> Present</div><div class="col-md-2"><button class="btn btn-primary">Save</button></div></form><table class="table"><thead><tr><th>Date</th><th>Employee</th><th>Status</th></tr></thead><tbody><tr th:each="a:${attendance}"><td th:text="${a.date}"></td><td th:text="${a.employee.name}"></td><td th:text="${a.present ? 'Present':'Absent'}"></td></tr></tbody></table></div></main></body></html>
